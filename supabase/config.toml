project_id = "macrotrack"

# The sign-in email's link should point at the deployed app, not localhost.
# The app verifies a typed code rather than following the link, so this is
# cosmetic for sign-in — but it is also what Supabase uses as the default
# redirect, and a wrong value here is confusing to land on.
[auth]
site_url = "https://macrotrack-brown.vercel.app"
additional_redirect_urls = [
  "https://macrotrack-brown.vercel.app",
  "http://localhost:3000",
]

# `config push` sends every default, not just the keys written here, so the
# values that matter are pinned explicitly rather than left to the CLI.
[auth.email]
enable_signup = true
enable_confirmations = false
# One sign-in email per minute. The CLI default of 1s removes the guard that
# stops a stranger burning the mailer quota on the deployed URL.
max_frequency = "60s"
otp_length = 6
otp_expiry = 3600

# Custom SMTP. Required, not optional: on the free tier with the built-in
# mailer Supabase refuses template edits, so the email can only ever contain a
# magic link — and the app asks for a typed code.
#
# Gmail rather than a domain-backed provider: this needs to deliver to anyone
# who signs up, and Resend's shared sender only reaches the account owner.
# Gmail sends to any address with no domain to verify. ~500 recipients/day,
# far above what sign-in codes will ever use. Credentials come from .env.local
# and are never committed.
[auth.email.smtp]
enabled = true
host = "smtp.gmail.com"
port = 465
user = "env(MAIL_FROM)"
pass = "env(GMAIL_APP_PASSWORD)"
sender_name = "MacroTrack"
admin_email = "env(MAIL_FROM)"

# Supabase's stock templates render {{ .ConfirmationURL }} — a magic link —
# and never {{ .Token }}. The app asks for a typed code (a link cannot hand a
# session back to an installed PWA reliably), so the email has to actually
# contain one. Both the existing-user and new-user paths use the same template.
[auth.email.template.magic_link]
subject = "Your MacroTrack sign-in code"
content_path = "./supabase/templates/otp.html"

[auth.email.template.confirmation]
subject = "Your MacroTrack sign-in code"
content_path = "./supabase/templates/otp.html"

# Both functions are invoked by pg_cron over pg_net, which cannot present a
# user JWT — they authenticate with the x-cron-secret header instead. Without
# this, a redeploy would silently re-enable JWT verification and every
# scheduled run would 401 with nothing in the UI to show for it.
[functions.send-nudges]
verify_jwt = false

[functions.purge-retention]
verify_jwt = false

[functions.daily-report]
verify_jwt = false
