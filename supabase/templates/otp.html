<!doctype html>
<html>
  <body style="margin:0;padding:32px 16px;background:#eee7dd;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#302a24">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:420px;margin:0 auto;background:#faf7f3;border-radius:24px;padding:32px 28px">
      <tr><td>
        <p style="margin:0 0 6px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8b7f70">MacroTrack AI</p>
        <h1 style="margin:0 0 10px;font-size:24px;font-weight:800;letter-spacing:-.02em">Your sign-in code</h1>
        <p style="margin:0 0 24px;font-size:14px;line-height:1.5;color:#7d7368">
          Type this into the app. It expires in an hour and works once.
        </p>

        <div style="background:#f6f0e8;border:1px solid #e0d8cd;border-radius:18px;padding:20px;text-align:center">
          <div style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:38px;font-weight:700;letter-spacing:.22em;color:#302a24">{{ .Token }}</div>
        </div>

        <p style="margin:24px 0 0;font-size:12.5px;line-height:1.5;color:#8b7f70">
          Didn't ask for this? Ignore it — nothing happens without the code.
        </p>
      </td></tr>
    </table>
  </body>
</html>
